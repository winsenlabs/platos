# Production deploy override — pull pre-built images, never build on the box.
#
# Usage on the VPS:
#   docker compose -f docker-compose.platos.yml -f docker-compose.deploy.yml \
#     pull agent webapp migrations-init memory-profile-migrate clickhouse-migrate
#   docker compose -f docker-compose.platos.yml -f docker-compose.deploy.yml \
#     --profile app up -d
#
# This override REPLACES the `build:` blocks of the five services below (agent,
# webapp, migrations-init, memory-profile-migrate, clickhouse-migrate) with
# registry image refs from GHCR (published only by the separately authorized
# .github/workflows/publish-images.yml action), and requires immutable digest
# references so `pull` can only fetch the off-box artifacts that passed the gate.
#
# IT DOES NOT REMOVE EVERY BUILD BLOCK. `docs-mcp-bridge` and `core-api` keep
# theirs under this override. And Compose does NOT ignore `build:` when `build`
# is not passed: `up` builds any service that has a build block and no local
# image (measured with compose 5.1.3 `up --dry-run`). So never start either of
# those two services through this file on the box; scripts/deploy-platos.sh
# pulls and starts only the five replaced services, and
# scripts/audit-platos-build.mjs pins the exact set that keeps a build block.
#
# Every application and migration image must be supplied as the exact tested
# `ghcr.io/...@sha256:...` reference. Tags are promotion pointers, not runtime
# identity, and are intentionally rejected by required-variable expansion.

services:
  agent:
    image: ${PLATOS_AGENT_IMAGE:?set PLATOS_AGENT_IMAGE to the tested ghcr.io digest reference}
    # Drop the build context so `docker compose build` is a no-op here and a
    # stray build can never compile on the prod box again.
    build: !reset null
    pull_policy: always

  webapp:
    image: ${PLATOS_WEBAPP_IMAGE:?set PLATOS_WEBAPP_IMAGE to the tested ghcr.io digest reference}
    build: !reset null
    pull_policy: always

  migrations-init:
    image: ${PLATOS_MIGRATIONS_IMAGE:?set PLATOS_MIGRATIONS_IMAGE to the tested ghcr.io digest reference}
    build: !reset null
    pull_policy: always

  memory-profile-migrate:
    image: ${PLATOS_MIGRATIONS_IMAGE:?set PLATOS_MIGRATIONS_IMAGE to the tested ghcr.io digest reference}
    build: !reset null
    pull_policy: always

  clickhouse-migrate:
    image: ${PLATOS_MIGRATIONS_IMAGE:?set PLATOS_MIGRATIONS_IMAGE to the tested ghcr.io digest reference}
    build: !reset null
    pull_policy: always
