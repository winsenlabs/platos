[project]
name = "platos-client"
version = "1.0.0"
description = "Official Python SDK for Platos — agents, threads, Jobs, and realtime streaming."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Winsen Labs", email = "hello@winsenlabs.com" }]
license = { text = "Apache-2.0" }
keywords = ["platos", "agents", "llm", "sdk", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Framework :: AsyncIO",
]
dependencies = [
  "httpx>=0.27.0",
  "websockets>=13.1",
  "typing-extensions>=4.12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.7.0",
  "mypy>=1.13.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[project.urls]
Homepage = "https://platos.dev"
Documentation = "https://platos.dev/docs/sdks"
Repository = "https://github.com/winsenlabs/platos"
Issues = "https://github.com/winsenlabs/platos/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["platos_client"]
