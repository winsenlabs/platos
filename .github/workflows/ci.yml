name: CI

# Tier-4 robustness: no red code merges. This session a TS2352 build-breaker
# reached `main` (and the production deploy) because nothing type-checked PRs —
# the agent Docker build (`nest build`, which runs tsc) only failed later, ON
# the box. A workhorse-on-autopilot must reject code that doesn't compile BEFORE
# it can be merged.
#
# SCOPE: this gate type-checks both shipping application surfaces. The explicit
# `platos-agent` graph gets a strict declaration build, and `webapp` runs its
# dedicated no-emit typecheck. It is deliberately NOT whole-monorepo yet:
# `@internal/zod-worker` still fails independently because legacy
# `moduleResolution: "Node"` cannot read eventsource-parser's exports-mapped
# types. Widening to the whole monorepo remains a follow-up after that debt is
# cleared. Branch protection should require the "typecheck" check so a red PR
# cannot be squashed in.

on:
  pull_request:
    branches: [main, v1]
  push:
    branches: [main, v1]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      win290-redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The WIN-234/WIN-238 parity gate independently inspects the pinned v0
          # archaeology commit instead of trusting counts stored in the matrix.
          fetch-depth: 0

      - name: Fetch exact WIN-253 vendored-build reviewed source
        env:
          REVIEWED_SOURCE_TAG: refs/tags/provenance/win253-vendored-build/e720b7618e58b27d3ff4f9aff5a5ca9ac6670130
          REVIEWED_SOURCE_COMMIT: e720b7618e58b27d3ff4f9aff5a5ca9ac6670130
          REVIEWED_SOURCE_REF: refs/platos-ci/provenance/win253-vendored-build/e720b7618e58b27d3ff4f9aff5a5ca9ac6670130
        run: |
          set -euo pipefail
          git fetch --no-tags --force origin \
            "${REVIEWED_SOURCE_TAG}:${REVIEWED_SOURCE_REF}"
          resolved_commit="$(git rev-parse --verify "${REVIEWED_SOURCE_REF}^{commit}")"
          test "$resolved_commit" = "$REVIEWED_SOURCE_COMMIT"

      - name: Install pnpm
        uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          version: 10.23.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: WIN-253 workspace reachability evidence
        run: |
          pnpm test:workspace-reachability
          pnpm audit:workspace-reachability

      - name: Install dependencies
        # --ignore-scripts: skip native addon builds (re2). CI needs only types
        # (typecheck) and the testcontainer suite; neither loads re2, and its
        # node-gyp build fails on the hosted runner (node-gyp@13 + undici@8).
        # The agent Docker build (which DOES need re2) builds it separately.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: WIN-254 docs, design, protection, and lifecycle evidence
        run: |
          pnpm test:docs-link-integrity
          pnpm test:design-provenance
          pnpm test:protected-paths
          pnpm test:evidence-lifecycle
          node --test scripts/verify-win254.test.mjs
          pnpm verify:win254

      - name: Generate and build compiled Agent dependencies
        # These packages expose only compiled dist entries, so focused Agent Vitest
        # runs need both package boundaries emitted from a fresh checkout.
        run: pnpm --filter @platos/tenancy-database build && pnpm --filter @internal/workload-identity build

      - name: Prove the workload identity shipping package boundary
        run: |
          pnpm test:workload-identity-package
          pnpm test:agent-runtime-smoke
          pnpm test:licenses

      - name: Audit Platos build and external-Trigger invariants
        run: pnpm audit:platos-build

      - name: Audit and test WIN-234/WIN-238 route and capability parity contract
        run: |
          pnpm audit:route-parity
          pnpm test:route-parity

      - name: Platos vocabulary boundary gate
        run: pnpm test:vocabulary && pnpm audit:vocabulary

      - name: V1 M0 executable evidence gates
        run: |
          pnpm test:ci-policy
          pnpm audit:root-manifest
          pnpm test:root-manifest
          pnpm exec lefthook validate
          pnpm audit:hook-policy
          pnpm test:hook-policy
          node --test scripts/vocabulary-boundary.nul.test.mjs
          node --test scripts/v1-ledger.test.mjs
          node scripts/v1-ledger.mjs --check
          pnpm test:win253-clickhouse-split
          pnpm audit:win253-clickhouse-split
          pnpm test:win253-vendored-build
          pnpm audit:win253-vendored-build
          pnpm audit:capability-matrix
          node --test scripts/capability-matrix.test.mjs
          node scripts/rest-census-independent.mjs --check
          node --test scripts/rest-census-independent.test.mjs
          node scripts/webapp-bff-matrix.mjs --check
          node --test scripts/webapp-bff-matrix.test.mjs
          node scripts/operator-operations.mjs --check
          node --test scripts/license-distribution.test.mjs
          node scripts/arch/gen-v1-skeleton.mjs --check
          pnpm test:v1-foundation
          pnpm test:install-git-hooks
          pnpm audit:v1-project-graph
          pnpm test:v1-project-graph
          pnpm audit:arch-boundaries
          pnpm test:arch-boundaries
          pnpm audit:max-file-lines
          pnpm test:max-file-lines
          pnpm audit:kernel-content
          pnpm test:kernel-content
          pnpm audit:sole-writer
          pnpm test:sole-writer
          pnpm audit:composition-root
          pnpm test:composition-root
          pnpm test:webapp-image-inventory
          pnpm test:webapp-inventory-contract
          pnpm test:advisory
          pnpm audit:advisory:check
          pnpm audit:advisory:nonvacuity
          pnpm build:v1
          pnpm test:v1-packages
          pnpm audit:test-case-census
          pnpm test:test-case-census
          node scripts/arch/contract-map.mjs --check
          pnpm audit:sbom:check
          pnpm audit:sbom:nonvacuity
          pnpm test:sbom
          pnpm test:differential-coverage
          pnpm audit:differential-coverage

      - name: WIN-284 differential harness and its negative controls
        # The suites prove the comparators, the register and the engine's
        # refusals. `test:differential-harness:controls` then runs the whole
        # seeded-divergence catalogue end to end and exits non-zero if ANY
        # seeded divergence goes uncaught or any vacuous run is reported as
        # parity. Both are here rather than only in the suite because the
        # catalogue is the acceptance evidence for this issue, and evidence
        # should be legible as its own step in the log rather than buried
        # inside a test summary.
        #
        # The catalogue's size is deliberately NOT quoted here, and it is not
        # left unpinned either. `assertSeedCoverage` derives the required
        # catalogue from the comparators: every divergence code that CAN be
        # emitted alone must have a seed that emits it alone, every code that
        # cannot must be named by a declared joint signature that has its own
        # seed, and each seed's observed codes must match its declaration
        # EXACTLY rather than merely include it. It then deletes each seed in
        # turn and requires the remainder to fail, so removing any single seed
        # turns this step red.
        #
        # CORRECTION, 2026-09-02. This comment previously said the size was not
        # pinned because "assertSeedCoverage is what enforces completeness".
        # That was false as written: the check enforced CODE coverage, so four
        # of the then twenty-seven seeds could each be deleted with both gates
        # staying green. Independent verification found it and the mechanism was
        # made to match the claim rather than the claim trimmed to the
        # mechanism — a gate whose banner in CI says more than the gate checks
        # is the precise failure this harness exists to detect.
        run: |
          pnpm test:differential-harness
          pnpm test:differential-harness:controls

      - name: External Trigger configuration and direct-dispatch tests
        run: pnpm --filter platos-agent exec vitest run src/shared/external-trigger-config.test.ts src/agent-runtime/turn-dispatch.service.spec.ts

      - name: Reproduce clean hosted-CI focused Agent Vitest consumers
        run: pnpm --filter platos-agent exec vitest run chat-session.task.test.ts internal-chat-turn-options.test.ts

      - name: WIN-290 ClickHouse lifecycle, redaction, and DLQ suite
        run: pnpm test:win-290

      - name: WIN-290 real Redis DLQ lifecycle suite
        env:
          PLATOS_TEST_REDIS_URL: redis://127.0.0.1:6379
        run: pnpm test:win-290:redis

      - name: Platos tenancy and operator-auth tests
        # Runs the complete clean-slate schema/service suite, including its real
        # Postgres testcontainer boundaries. This protects the operator/end-user
        # tier separation added in WIN-121 rather than relying on sandbox-only runs.
        run: pnpm --filter @platos/tenancy-database test

      - name: Webapp memory-policy tests
        run: pnpm --filter webapp exec vitest run test/memoryPolicy.test.ts

      - name: Webapp typecheck
        run: pnpm --filter webapp typecheck

      - name: Prove source-only evidence verifiers fail on mutation
        run: |
          pnpm --filter platos-agent exec vitest run src/auth/rate-limit.guard.test.ts
          pnpm --filter platos-agent exec vitest run src/memory/memory-profile-startup-verifier.service.test.ts
          pnpm --filter platos-agent exec vitest run src/startup-failure.test.ts
          pnpm test:persisted-state:performance-contract
          pnpm test:non-browser-completion:contract
          pnpm test:browser-evidence:contract
          pnpm test:route-parity:completion:evidence

      - name: Strict declaration build for the explicit Platos agent graph
        # Builds only the agent's real runtime graph and emits declarations.
        # The separate image workflow builds the webapp's still-deferred engine
        # closure under the guarded, serialized memory policy.
        run: pnpm run build:platos:agent

  cross-scope-isolation:
    # Security enforcement gate: the top remaining item of the 2026-07-16
    # cross-tenant audit. Runs the real Postgres-testcontainer suite that
    # proves cross-ORG and cross-USER Prisma queries are fail-closed. If this
    # goes red, a hardening regression has landed. ubuntu-latest ships Docker,
    # which Testcontainers needs. Scoped to the ONE file so we are not turning
    # on the whole agent unit suite by surprise.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          version: 10.23.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        # --ignore-scripts: skip native addon builds (re2). CI needs only types
        # (typecheck) and the testcontainer suite; neither loads re2, and its
        # node-gyp build fails on the hosted runner (node-gyp@13 + undici@8).
        # The agent Docker build (which DOES need re2) builds it separately.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Prisma client
        # @internal/testcontainers + the test both import @platos/database,
        # which re-exports the generated client. Without this the PrismaClient
        # type/runtime is missing. Also emits the query engine the container
        # `prisma db push` and the injected client rely on.
        run: pnpm --filter @platos/database generate

      - name: Build testcontainers dependency graph
        # @internal/testcontainers (the test's fixture source) imports workspace
        # packages whose entry is ./dist/index.js (a tsc build), not TS source —
        # @platos/database, @platos/core, etc. `prisma generate` leaves those
        # dist/ dirs absent, so vitest's vite resolver fails one at a time
        # ("Failed to resolve entry for package @platos/…"). Typecheck doesn't
        # hit this (tsc resolves via source/paths; vite via the package `main`).
        # `@internal/testcontainers...` (ellipsis = pkg + its dependencies)
        # builds the whole graph in topological order, so every dist/ exists
        # before vitest runs.
        run: pnpm --filter "@internal/testcontainers..." build

      - name: Cross-scope isolation suite (real Postgres testcontainer)
        run: pnpm --filter platos-agent exec vitest run src/auth/cross-scope-isolation.test.ts

  postgres-tenancy-repository:
    name: postgres-tenancy-repository
    # WIN-258. Runs the PostgreSQL TenancyRepository against a REAL PostgreSQL
    # built by the repository's own `prisma migrate deploy` over the canonical
    # tenancy schema, and compares it step by step against the in-memory fake the
    # context ships as its contract fixture. It also proves the transaction
    # boundary by failure injection and the three transaction-scope refusals by
    # violating input.
    #
    # It is a SEPARATE job for the same reason differential-state-conservation
    # is: it needs a Docker daemon, which the typecheck job's service containers
    # do not provide, and `pnpm test:v1-packages` must stay runnable without one.
    #
    # The suites FAIL when Docker is absent rather than skipping. A skipped
    # integration run and a passing one are indistinguishable in a summary, and
    # this job is the whole of this issue's real-store evidence.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          version: 10.23.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build the tenancy database client
        # The adapter imports the generated client through the package `main`,
        # which vite resolves from dist/. Building it also runs `prisma generate`
        # through the package's own prebuild, so the client and the migrations
        # this job applies come from one schema.
        run: pnpm --filter @platos/tenancy-database build

      - name: Build the tenancy context
        # vitest resolves @platos/context-tenancy through its package `main` too.
        run: pnpm --filter "@platos/context-tenancy..." build

      - name: Build the identity-access context
        # WIN-258 T2. The same directory now also implements
        # `IdentityAccessRepository` (ADR M0.3 §15), and its suites resolve that
        # context through its package `main`, which is dist/.
        run: pnpm --filter "@platos/context-identity-access..." build

      - name: Build the tools context
        # WIN-258 T5. The same directory also implements `ToolsRepository`, and
        # its suites resolve `@platos/context-tools` — and the in-memory double
        # the conformance differential compares against, published from that
        # package's `./application/testing/index.js` export — through the package
        # `main`, which is dist/. Without this step the tools suites fail to
        # RESOLVE rather than fail to pass, which reads as a broken job rather
        # than as a broken adapter.
        run: pnpm --filter "@platos/context-tools..." build
      - name: Build the agents context
        # WIN-258 T5. The same directory a fourth time, for the seven rows of ADR
        # M0.3 §1 row 5. The agents suites resolve the context through TWO
        # published entry points — its driven ports and its `application/index.js`,
        # which is where the in-memory doubles the conformance differential is
        # measured against live — and both are dist/.
        run: pnpm --filter "@platos/context-agents..." build
      - name: Build the cost-monitoring context
        # WIN-258 T5. The same directory also implements `BudgetRepository`, and
        # its suites resolve that context through TWO published subpaths, both of
        # which are dist/: `application/ports/index.js` for the port and the
        # domain values its signatures name, and `application/testing/index.js`
        # for `InMemoryBudgetRepository`, which the conformance differential is
        # measured against. Without this step the six suites do not fail an
        # assertion — they fail to LOAD, which is the vacuity the mutation driver
        # beside this package refuses to score.
        run: pnpm --filter "@platos/context-cost-monitoring..." build
      - name: Build the channels context
        # WIN-258 T5. The same directory a SIXTH time, for the six rows of ADR
        # M0.3 §1 row 9. Its suites resolve that context through TWO published
        # subpaths, both of which are dist/: `application/ports/index.js` for the
        # port and the domain values its signatures name, and
        # `application/testing/index.js` for `InMemoryChannelsRepository`, which
        # the conformance differential is measured against. Without this step the
        # six suites do not fail an assertion — they fail to LOAD, which is the
        # vacuity the mutation driver beside this package refuses to score, and
        # which this tranche saw for real once when a harness collision skipped
        # all ten cases of a suite and the run reported nothing failing.
        run: pnpm --filter "@platos/context-channels..." build

      - name: Build the governance context
        # WIN-258 T5. The SIXTH owner delegated to this directory, and the one
        # whose suites need the most from its context: the five canonical-store
        # ports and the domain values their signatures name come from
        # `application/ports/index.js`, and all FIVE in-memory doubles the
        # conformance differential is measured against come from
        # `application/testing/index.js`. Both are dist/. Without this step the
        # five suites do not fail an assertion — they fail to LOAD, which is the
        # vacuity the mutation driver beside this package refuses to score.
        run: pnpm --filter "@platos/context-governance..." build
      - name: Build the secrets context
        # WIN-258 T5. The same directory also implements `SecretsRepository` and
        # `EnvironmentVariableRepository`, and its suites resolve that context
        # through TWO published subpaths, both of which are dist/:
        # `application/ports/index.js` for the two ports and the eleven domain
        # types their signatures name, and `application/index.js` for
        # `inMemorySecretsStore`, which the conformance differential is measured
        # against. Without this step the seven suites do not fail an assertion —
        # they fail to LOAD, which is the vacuity the mutation driver beside this
        # package refuses to score.
        run: pnpm --filter "@platos/context-secrets..." build

      - name: PostgreSQL repository integration suites
        # All FOUR quarters of the one directory (ADR M0.3 §15): the tenancy
        # repository, the identity-access canonical store, the kernel outbox's
        # `Event` row — WIN-258 tranche 4, written from here because its owner is
        # an adapter that may not hold the ORM — and, tranche 5, the `tools`
        # canonical store over the ten rows that context owns.
        #
        # Between them: three conformance differentials against the doubles those
        # ports ship, the differential against PlatosAuthService, the
        # migration-only constraint proofs, the failure-injection transaction
        # proofs and the measured statement counts. Tranche 5 also lands the
        # `secrets` canonical store here — the four rows of ADR M0.3 §1 row 3,
        # whose two ports are the first in this directory that could not be
        # spread into the adapter at all. The suites are selected by
        # the word `integration` in their filename, so a new one joins this run
        # by being named — there is no list here to forget to update.
        #
        # They FAIL when Docker is absent rather than skipping.
        run: pnpm test:postgres-tenancy:integration

  differential-state-conservation:
    name: differential-state-conservation
    # WIN-284. Twin-runs the harness against TWO isolated PostgreSQL databases
    # built from the real tenancy schema by the repository's own
    # `prisma migrate deploy`, then seeds real store-level divergences and
    # requires each to be caught. It also requires every dimension a scenario
    # declares to have been seen to diverge ON THAT SCENARIO, so a dimension
    # cannot sit in the comparison contributing facts it can never fail on. It
    # is a separate job because it needs a Docker daemon, which the typecheck
    # job's service containers do not provide.
    #
    # The runner FAILS when Docker is absent rather than skipping. A skipped
    # conservation run is indistinguishable from a passing one in a summary, and
    # that is precisely the vacuity this issue exists to prevent.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          version: 10.23.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Twin-store state conservation and seeded store divergences
        run: pnpm test:differential-harness:store

  postgres-memory-evidence:
    name: postgres-memory-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: platos_memory_evidence_ci
          POSTGRES_PASSWORD: postgres-memory-evidence
          POSTGRES_DB: platos_memory_evidence_ci
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U platos_memory_evidence_ci -d platos_memory_evidence_ci"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      PLATOS_POSTGRES_INTEGRATION_DATABASE_URL: postgresql://platos_memory_evidence_ci:postgres-memory-evidence@127.0.0.1:55433/platos_memory_evidence_ci?schema=public
      PLATOS_POSTGRES_INTEGRATION_ALLOW_RESET: "1"
      PLATOS_POSTGRES_EVIDENCE_DIR: artifacts/win236-win237-postgres
      PLATOS_POSTGRES_EVIDENCE_REQUIRED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          version: 10.23.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install lockfile-backed dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build canonical tenancy client
        run: pnpm --filter @platos/tenancy-database build

      - name: Explicitly provision the server-side disposable reset sentinel
        run: pnpm provision:postgres-memory:evidence

      - name: Prove fail-loud evidence contract mutation sensitivity
        run: pnpm test:postgres-memory:contract

      - name: Execute all WIN-236/WIN-237 PostgreSQL suites and capture evidence
        run: pnpm test:postgres-memory:evidence

      - name: Re-verify the upload contract
        run: pnpm test:postgres-memory:artifacts -- "$PLATOS_POSTGRES_EVIDENCE_DIR"

      - name: Upload PostgreSQL execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: win236-win237-postgres-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/win236-win237-postgres
          if-no-files-found: error
          retention-days: 14
