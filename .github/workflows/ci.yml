name: CI

# Tier-4 robustness: no red code merges. This session a TS2352 build-breaker
# reached `main` (and the production deploy) because nothing type-checked PRs —
# the agent Docker build (`nest build`, which runs tsc) only failed later, ON
# the box. A workhorse-on-autopilot must reject code that doesn't compile BEFORE
# it can be merged.
#
# SCOPE: this gate type-checks both shipping application surfaces. The explicit
# `platos-agent` graph gets a strict declaration build, and `webapp` runs its
# dedicated no-emit typecheck. It is deliberately NOT whole-monorepo yet:
# `@internal/zod-worker` still fails independently because legacy
# `moduleResolution: "Node"` cannot read eventsource-parser's exports-mapped
# types. Widening to the whole monorepo remains a follow-up after that debt is
# cleared. Branch protection should require the "typecheck" check so a red PR
# cannot be squashed in.

on:
  pull_request:
    branches: [main, v1]
  push:
    branches: [main, v1]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      win290-redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The WIN-234/WIN-238 parity gate independently inspects the pinned v0
          # archaeology commit instead of trusting counts stored in the matrix.
          fetch-depth: 0

      - name: Fetch exact WIN-253 vendored-build reviewed source
        env:
          REVIEWED_SOURCE_TAG: refs/tags/provenance/win253-vendored-build/e720b7618e58b27d3ff4f9aff5a5ca9ac6670130
          REVIEWED_SOURCE_COMMIT: e720b7618e58b27d3ff4f9aff5a5ca9ac6670130
          REVIEWED_SOURCE_REF: refs/platos-ci/provenance/win253-vendored-build/e720b7618e58b27d3ff4f9aff5a5ca9ac6670130
        run: |
          set -euo pipefail
          git fetch --no-tags --force origin \
            "${REVIEWED_SOURCE_TAG}:${REVIEWED_SOURCE_REF}"
          resolved_commit="$(git rev-parse --verify "${REVIEWED_SOURCE_REF}^{commit}")"
          test "$resolved_commit" = "$REVIEWED_SOURCE_COMMIT"

      - name: Install pnpm
        uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          version: 10.23.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: WIN-253 workspace reachability evidence
        run: |
          pnpm test:workspace-reachability
          pnpm audit:workspace-reachability

      - name: Install dependencies
        # --ignore-scripts: skip native addon builds (re2). CI needs only types
        # (typecheck) and the testcontainer suite; neither loads re2, and its
        # node-gyp build fails on the hosted runner (node-gyp@13 + undici@8).
        # The agent Docker build (which DOES need re2) builds it separately.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: WIN-254 docs, design, protection, and lifecycle evidence
        run: |
          pnpm test:docs-link-integrity
          pnpm test:design-provenance
          pnpm test:protected-paths
          pnpm test:evidence-lifecycle
          node --test scripts/verify-win254.test.mjs
          pnpm verify:win254

      - name: Generate and build database clients
        # The clean tenancy package is the agent's compiled persistence dependency,
        # so focused Vitest runs need its package entry emitted from a fresh checkout.
        run: pnpm --filter @platos/tenancy-database build

      - name: Prove the workload identity shipping package boundary
        run: |
          pnpm test:workload-identity-package
          pnpm test:agent-runtime-smoke
          pnpm test:licenses

      - name: Audit Platos build and external-Trigger invariants
        run: pnpm audit:platos-build

      - name: Audit and test WIN-234/WIN-238 route and capability parity contract
        run: |
          pnpm audit:route-parity
          pnpm test:route-parity

      - name: Platos vocabulary boundary gate
        run: pnpm test:vocabulary && pnpm audit:vocabulary

      - name: V1 M0 executable evidence gates
        run: |
          pnpm test:ci-policy
          pnpm audit:root-manifest
          pnpm test:root-manifest
          pnpm exec lefthook validate
          pnpm audit:hook-policy
          pnpm test:hook-policy
          node --test scripts/vocabulary-boundary.nul.test.mjs
          node --test scripts/v1-ledger.test.mjs
          node scripts/v1-ledger.mjs --check
          pnpm test:win253-clickhouse-split
          pnpm audit:win253-clickhouse-split
          pnpm test:win253-vendored-build
          pnpm audit:win253-vendored-build
          pnpm audit:capability-matrix
          node scripts/rest-census-independent.mjs --check
          node --test scripts/rest-census-independent.test.mjs
          node scripts/webapp-bff-matrix.mjs --check
          node --test scripts/webapp-bff-matrix.test.mjs
          node scripts/operator-operations.mjs --check
          node --test scripts/license-distribution.test.mjs
          node scripts/arch/gen-v1-skeleton.mjs --check
          pnpm test:v1-foundation
          pnpm test:install-git-hooks
          pnpm audit:v1-project-graph
          pnpm test:v1-project-graph
          pnpm audit:arch-boundaries
          pnpm test:arch-boundaries
          pnpm audit:max-file-lines
          pnpm test:max-file-lines
          pnpm test:webapp-image-inventory
          pnpm test:webapp-inventory-contract
          pnpm test:advisory
          pnpm audit:advisory:check
          pnpm build:v1
          node scripts/arch/contract-map.mjs --check
          pnpm audit:sbom:check
          pnpm audit:sbom:nonvacuity
          pnpm test:sbom

      - name: External Trigger configuration and direct-dispatch tests
        run: |
          pnpm --filter platos-agent exec vitest run src/shared/external-trigger-config.test.ts src/agent-runtime/turn-dispatch.service.spec.ts
          pnpm --filter platos-agent exec vitest run chat-session.task.test.ts internal-chat-turn-options.test.ts

      - name: WIN-290 ClickHouse lifecycle, redaction, and DLQ suite
        run: pnpm test:win-290

      - name: WIN-290 real Redis DLQ lifecycle suite
        env:
          PLATOS_TEST_REDIS_URL: redis://127.0.0.1:6379
        run: pnpm test:win-290:redis

      - name: Platos tenancy and operator-auth tests
        # Runs the complete clean-slate schema/service suite, including its real
        # Postgres testcontainer boundaries. This protects the operator/end-user
        # tier separation added in WIN-121 rather than relying on sandbox-only runs.
        run: pnpm --filter @platos/tenancy-database test

      - name: Webapp memory-policy tests
        run: pnpm --filter webapp exec vitest run test/memoryPolicy.test.ts

      - name: Webapp typecheck
        run: pnpm --filter webapp typecheck

      - name: Prove source-only evidence verifiers fail on mutation
        run: |
          pnpm --filter platos-agent exec vitest run src/auth/rate-limit.guard.test.ts
          pnpm --filter platos-agent exec vitest run src/memory/memory-profile-startup-verifier.service.test.ts
          pnpm --filter platos-agent exec vitest run src/startup-failure.test.ts
          pnpm test:persisted-state:performance-contract
          pnpm test:non-browser-completion:contract
          pnpm test:browser-evidence:contract
          pnpm test:route-parity:completion:evidence

      - name: Strict declaration build for the explicit Platos agent graph
        # Builds only the agent's real runtime graph and emits declarations.
        # The separate image workflow builds the webapp's still-deferred engine
        # closure under the guarded, serialized memory policy.
        run: pnpm run build:platos:agent

  cross-scope-isolation:
    # Security enforcement gate: the top remaining item of the 2026-07-16
    # cross-tenant audit. Runs the real Postgres-testcontainer suite that
    # proves cross-ORG and cross-USER Prisma queries are fail-closed. If this
    # goes red, a hardening regression has landed. ubuntu-latest ships Docker,
    # which Testcontainers needs. Scoped to the ONE file so we are not turning
    # on the whole agent unit suite by surprise.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          version: 10.23.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        # --ignore-scripts: skip native addon builds (re2). CI needs only types
        # (typecheck) and the testcontainer suite; neither loads re2, and its
        # node-gyp build fails on the hosted runner (node-gyp@13 + undici@8).
        # The agent Docker build (which DOES need re2) builds it separately.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Prisma client
        # @internal/testcontainers + the test both import @platos/database,
        # which re-exports the generated client. Without this the PrismaClient
        # type/runtime is missing. Also emits the query engine the container
        # `prisma db push` and the injected client rely on.
        run: pnpm --filter @platos/database generate

      - name: Build testcontainers dependency graph
        # @internal/testcontainers (the test's fixture source) imports workspace
        # packages whose entry is ./dist/index.js (a tsc build), not TS source —
        # @platos/database, @platos/core, etc. `prisma generate` leaves those
        # dist/ dirs absent, so vitest's vite resolver fails one at a time
        # ("Failed to resolve entry for package @platos/…"). Typecheck doesn't
        # hit this (tsc resolves via source/paths; vite via the package `main`).
        # `@internal/testcontainers...` (ellipsis = pkg + its dependencies)
        # builds the whole graph in topological order, so every dist/ exists
        # before vitest runs.
        run: pnpm --filter "@internal/testcontainers..." build

      - name: Cross-scope isolation suite (real Postgres testcontainer)
        run: pnpm --filter platos-agent exec vitest run src/auth/cross-scope-isolation.test.ts

  postgres-memory-evidence:
    name: postgres-memory-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: platos_memory_evidence_ci
          POSTGRES_PASSWORD: postgres-memory-evidence
          POSTGRES_DB: platos_memory_evidence_ci
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U platos_memory_evidence_ci -d platos_memory_evidence_ci"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      PLATOS_POSTGRES_INTEGRATION_DATABASE_URL: postgresql://platos_memory_evidence_ci:postgres-memory-evidence@127.0.0.1:55433/platos_memory_evidence_ci?schema=public
      PLATOS_POSTGRES_INTEGRATION_ALLOW_RESET: "1"
      PLATOS_POSTGRES_EVIDENCE_DIR: artifacts/win236-win237-postgres
      PLATOS_POSTGRES_EVIDENCE_REQUIRED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          version: 10.23.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install lockfile-backed dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build canonical tenancy client
        run: pnpm --filter @platos/tenancy-database build

      - name: Explicitly provision the server-side disposable reset sentinel
        run: pnpm provision:postgres-memory:evidence

      - name: Prove fail-loud evidence contract mutation sensitivity
        run: pnpm test:postgres-memory:contract

      - name: Execute all WIN-236/WIN-237 PostgreSQL suites and capture evidence
        run: pnpm test:postgres-memory:evidence

      - name: Re-verify the upload contract
        run: pnpm test:postgres-memory:artifacts -- "$PLATOS_POSTGRES_EVIDENCE_DIR"

      - name: Upload PostgreSQL execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: win236-win237-postgres-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/win236-win237-postgres
          if-no-files-found: error
          retention-days: 14
