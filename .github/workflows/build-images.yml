name: Build, gate, and publish container images

# Every event builds one immutable OCI archive per candidate. Pull requests,
# including forks, never authenticate to GHCR or publish official packages. The
# required gate loads the downloaded archives into the runner and tests those
# exact manifest digests. Only a trusted main/manual run may publish, and it
# does so after the gate by copying the verified manifests without rebuilding.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {} # trusted manual main-branch rebuild without deployment

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  REGCTL_VERSION: v0.9.2
  REGCTL_LINUX_AMD64_SHA256: 4da11cfe7009661a498ffafc11f510049864ffb4eb44961743618b3975db3c55

jobs:
  build-candidates:
    name: build-candidate-${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: agent
            image: platos-agent
            dockerfile: apps/agent/Dockerfile
            env_name: AGENT
          - name: webapp
            image: platos-webapp
            dockerfile: apps/webapp/Dockerfile.platos
            env_name: WEBAPP
          - name: migrations
            image: platos-migrations
            dockerfile: internal-packages/tenancy-database/Dockerfile.migrations
            env_name: MIGRATIONS
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build the candidate exactly once as an OCI archive
        id: candidate
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          tags: win235.local/${{ matrix.image }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            dev.platos.candidate-run=${{ github.run_id }}-${{ github.run_attempt }}
          outputs: type=oci,dest=${{ runner.temp }}/${{ matrix.name }}.oci.tar,oci-mediatypes=true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }},ignore-error=true
          provenance: false

      - name: Record immutable candidate identity and archive checksum
        shell: bash
        env:
          CANDIDATE_DIGEST: ${{ steps.candidate.outputs.digest }}
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/${{ matrix.name }}.oci.tar"
          test -s "$archive"
          [[ "$CANDIDATE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          index_digest="$(
            tar -xOf "$archive" index.json | node -e '
              let input = "";
              process.stdin.on("data", (chunk) => (input += chunk));
              process.stdin.on("end", () => {
                const index = JSON.parse(input);
                if (!Array.isArray(index.manifests) || index.manifests.length !== 1) process.exit(2);
                process.stdout.write(index.manifests[0].digest);
              });
            '
          )"
          test "$index_digest" = "$CANDIDATE_DIGEST"
          mkdir -p artifacts/candidates
          mv "$archive" "artifacts/candidates/${{ matrix.name }}.oci.tar"
          archive_sha="$(sha256sum "artifacts/candidates/${{ matrix.name }}.oci.tar" | awk '{ print $1 }')"
          {
            printf 'WIN235_%s_IMAGE=%s/%s/%s@%s\n' \
              '${{ matrix.env_name }}' '${{ env.REGISTRY }}' '${{ env.IMAGE_NAMESPACE }}' \
              '${{ matrix.image }}' "$CANDIDATE_DIGEST"
            printf 'WIN235_%s_ARCHIVE_SHA256=%s\n' '${{ matrix.env_name }}' "$archive_sha"
          } > "artifacts/candidates/${{ matrix.name }}.env"

      - name: Upload candidate OCI artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: win235-candidate-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/candidates/${{ matrix.name }}.env
            artifacts/candidates/${{ matrix.name }}.oci.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  persisted-state:
    name: persisted-state-completion
    needs: build-candidates
    # Playwright 1.50's pinned Linux dependency manifest targets Ubuntu 22.04;
    # ubuntu-latest is Noble, where libasound2 was replaced by libasound2t64.
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    permissions:
      contents: read
    env:
      COMPOSE_FILE: .github/compose/persisted-state-gate.yml
      COMPOSE_PROJECT_NAME: platos-win235-${{ github.run_id }}-${{ github.run_attempt }}
      DATABASE_URL: postgresql://postgres:win235-postgres-evidence-password@127.0.0.1:55432/platos_control?schema=public
      DIRECT_URL: postgresql://postgres:win235-postgres-evidence-password@127.0.0.1:55432/platos_control?schema=public
      REDIS_URL: redis://127.0.0.1:56379
      CLICKHOUSE_URL: http://127.0.0.1:58123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: win235-clickhouse-evidence-password
      MINIO_ENDPOINT: http://127.0.0.1:59001
      MINIO_ACCESS_KEY: persisted-state-gate
      MINIO_SECRET_KEY: persisted-state-gate-password
      MINIO_BUCKET: platos-media
      MINIO_REGION: us-east-1
      PLATOS_AGENT_API_URL: http://127.0.0.1:3100
      WIN235_WEBAPP_URL: http://127.0.0.1:3030
      PLATOS_INTERNAL_AUTH_TOKEN: win235-internal-auth-token
      PLATOS_PERFORMANCE_EVIDENCE_ENABLED: "1"
      PLATOS_PERFORMANCE_EVIDENCE_TOKEN: win235-performance-evidence-token
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      SESSION_SECRET: win235-session-secret-with-at-least-thirty-two-characters
      MAGIC_LINK_SECRET: win235-magic-link-secret-with-at-least-thirty-two-characters
      LOGIN_ORIGIN: http://127.0.0.1:3030
      NODE_ENV: test
      WIN235_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/win235
      WIN234_BROWSER_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/win234-browser
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download candidate OCI artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: win235-candidate-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/candidates
          merge-multiple: true

      - name: Install checksum-pinned regctl
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/regctl-bin"
          curl --fail --silent --show-error --location \
            "https://github.com/regclient/regclient/releases/download/${REGCTL_VERSION}/regctl-linux-amd64" \
            --output "$RUNNER_TEMP/regctl-bin/regctl"
          printf '%s  %s\n' "$REGCTL_LINUX_AMD64_SHA256" "$RUNNER_TEMP/regctl-bin/regctl" \
            | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/regctl-bin/regctl"
          echo "$RUNNER_TEMP/regctl-bin" >> "$GITHUB_PATH"

      - name: Verify and load the exact OCI candidates without registry access
        shell: bash
        run: |
          tests/persisted-state-gate/prepare-candidate-images.sh \
            artifacts/candidates "$RUNNER_TEMP/win235-oci" true

      - name: Install pnpm
        uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          version: 10.23.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0
          cache: pnpm

      - name: Install lockfile-backed test dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install the pinned Chromium evidence runtime
        run: pnpm exec playwright install --with-deps chromium

      - name: Generate and build the canonical tenancy client for the external test runner
        run: pnpm --filter @platos/tenancy-database build

      - name: Rehearse the ordered tenancy upgrade before evidence
        run: |
          CI=true pnpm --filter @platos/tenancy-database exec vitest run \
            src/upgrade-contract.test.ts \
            src/upgrade-rehearsal.integration.test.ts \
            --reporter=verbose

      - name: Start digest-pinned clean stores
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/win235 artifacts/win234-browser
          docker compose up --detach --no-build --wait --wait-timeout 300 postgres redis clickhouse minio \
            2>&1 | tee artifacts/win235/compose-stores.log

      - name: Run the tested Postgres and ClickHouse migration candidate
        shell: bash
        run: |
          set -euo pipefail
          docker compose up --detach --no-build postgres-migrate clickhouse-migrate minio-init \
            2>&1 | tee artifacts/win235/migrations.log
          for service in postgres-migrate clickhouse-migrate minio-init; do
            container_id="$(docker compose ps --all --quiet "$service")"
            test -n "$container_id"
            exit_code="$(timeout 300 docker wait "$container_id")"
            docker compose logs --no-color --timestamps "$service" \
              2>&1 | tee -a artifacts/win235/migrations.log
            test "$exit_code" = "0"
          done

      - name: Rehearse ClickHouse namespace rollback and conservation
        shell: bash
        run: |
          set -euo pipefail
          docker compose run --rm --no-deps clickhouse-migrate clickhouse-namespace-rehearsal \
            2>&1 | tee artifacts/win235/clickhouse-namespace-rehearsal.log

      - name: Seed only the isolated, empty gate stores
        shell: bash
        env:
          WIN235_ALLOW_SEED: "1"
        run: |
          set -euo pipefail
          pnpm seed:persisted-state -- --output artifacts/win235/fixture-manifest.json \
            2>&1 | tee artifacts/win235/fixture-seed.log

      - name: Persist and read back the fixture through digest-pinned MinIO tooling
        shell: bash
        run: |
          set -euo pipefail
          docker compose run --rm --no-deps minio-fixture \
            2>&1 | tee artifacts/win235/minio-readback.log
          cmp artifacts/win235/fixture-manifest.json \
            artifacts/win235/fixture-manifest.readback.json
          echo "WIN-235 MinIO fixture read-back matches" \
            | tee -a artifacts/win235/minio-readback.log

      - name: Start the exact Agent and webapp candidate pair
        shell: bash
        run: |
          set -euo pipefail
          docker compose up --detach --no-build --wait --wait-timeout 300 agent webapp \
            2>&1 | tee artifacts/win235/compose-apps.log

      - name: Record tested candidate identities
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require("node:fs");
          const images = {
            commitSha: process.env.GITHUB_SHA,
            agent: process.env.WIN235_AGENT_IMAGE,
            webapp: process.env.WIN235_WEBAPP_IMAGE,
            migrations: process.env.WIN235_MIGRATIONS_IMAGE,
          };
          fs.writeFileSync("artifacts/win235/candidate-images.json", `${JSON.stringify(images, null, 2)}\n`);
          NODE

      - name: Prove performance and evidence verifiers fail on mutation
        run: |
          pnpm --filter platos-agent exec vitest run src/auth/rate-limit.guard.test.ts
          pnpm test:persisted-state:performance-contract
          pnpm test:non-browser-completion:contract
          pnpm test:browser-evidence:contract
          pnpm test:route-parity:completion:evidence

      - name: Measure the pristine dense fixture against the exact candidates
        shell: bash
        run: |
          set -euo pipefail
          pnpm test:persisted-state:performance \
            2>&1 | tee artifacts/win235/performance.log
          pnpm test:persisted-state:performance-artifacts

      - name: Exercise live Remix adapters, generated links, and Agent controllers
        shell: bash
        run: |
          set -euo pipefail
          pnpm test:persisted-state:integration \
            2>&1 | tee artifacts/win235/integration.log

      - name: Prove all non-browser completion cells against PostgreSQL
        shell: bash
        env:
          PLATOS_CANDIDATE_SHA: ${{ github.sha }}
          PLATOS_EVIDENCE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          pnpm test:non-browser-completion \
            2>&1 | tee artifacts/win235/non-browser-evidence.log

      - name: Exercise every authenticated browser capability and visual mode
        shell: bash
        run: |
          set -euo pipefail
          pnpm test:browser-evidence \
            2>&1 | tee artifacts/win235/browser-evidence.log
          pnpm test:browser-evidence:artifacts -- "$WIN234_BROWSER_ARTIFACT_DIR"

      - name: Require zero unresolved release-completion cells
        shell: bash
        env:
          PLATOS_EVIDENCE_RUN_ID: ${{ github.run_id }}
          PLATOS_NON_BROWSER_EVIDENCE_OUTPUT: ${{ github.workspace }}/artifacts/win235/non-browser-evidence.json
          PLATOS_BROWSER_EVIDENCE_DIRECTORY: ${{ github.workspace }}/artifacts/win234-browser
        run: |
          set -euo pipefail
          pnpm audit:route-parity:completion:evidence \
            2>&1 | tee artifacts/win235/completion-audit.log

      - name: Verify persisted-state evidence and immutable image identity
        run: pnpm test:persisted-state:artifacts

      - name: Collect fail-loud diagnostics
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/win235 artifacts/win234-browser
          docker compose ps --all > artifacts/win235/compose-status.log 2>&1
          docker compose logs --no-color --timestamps > artifacts/win235/compose.log 2>&1
          docker compose logs --no-color --timestamps agent > artifacts/win235/agent.log 2>&1
          docker compose logs --no-color --timestamps webapp > artifacts/win235/webapp.log 2>&1
          docker compose logs --no-color --timestamps postgres-migrate > artifacts/win235/postgres-migration.log 2>&1
          docker compose logs --no-color --timestamps clickhouse-migrate > artifacts/win235/clickhouse-migration.log 2>&1
          docker compose exec -T redis redis-cli --raw GET win235:fixture:manifest \
            > artifacts/win235/redis-readback.json 2>&1
          docker compose exec -T clickhouse clickhouse-client \
            --user default --password win235-clickhouse-evidence-password \
            --query "SELECT organization_id, project_id, environment_id, metric_name, value FROM platos_telemetry.metrics_v1 WHERE metric_name = 'win235.persisted_fixture' ORDER BY organization_id FORMAT TSVWithNames" \
            > artifacts/win235/clickhouse-readback.tsv 2>&1
          docker compose exec -T postgres psql -U postgres -d platos_control -P pager=off \
            -c 'SELECT (SELECT count(*) FROM "Organization") AS organizations, (SELECT count(*) FROM "Agent") AS agents, (SELECT count(*) FROM "Turn") AS turns, (SELECT count(*) FROM "Tool") AS tools, (SELECT count(*) FROM "Memory") AS memories, (SELECT count(*) FROM "MemoryEntity") AS graph_entities;' \
            > artifacts/win235/postgres-readback.log 2>&1
          cp tests/persisted-state-gate/artifact-schema.json artifacts/win235/
          cp tests/persisted-state-gate/budgets.schema.json artifacts/win235/
          cp tests/persisted-state-gate/budgets.v1.json artifacts/win235/
          cp tests/persisted-state-gate/performance-artifact.schema.json artifacts/win235/
          cp tests/browser-evidence/artifact-schema.json artifacts/win234-browser/

      - name: Upload persisted-state evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: win235-persisted-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/win235
          if-no-files-found: warn
          retention-days: 14

      - name: Upload authenticated browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: win234-browser-evidence-${{ github.run_id }}
          path: artifacts/win234-browser
          if-no-files-found: warn
          retention-days: 14

      - name: Tear down isolated gate infrastructure
        if: always()
        continue-on-error: true
        run: docker compose down --volumes --remove-orphans

  publish-images:
    name: publish-tested-image-digests
    needs: [build-candidates, persisted-state]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout trusted release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download tested candidate OCI artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: win235-candidate-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/candidates
          merge-multiple: true

      - name: Download passing persisted-state identity evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: win235-persisted-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/gate

      - name: Install checksum-pinned regctl
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/regctl-bin"
          curl --fail --silent --show-error --location \
            "https://github.com/regclient/regclient/releases/download/${REGCTL_VERSION}/regctl-linux-amd64" \
            --output "$RUNNER_TEMP/regctl-bin/regctl"
          printf '%s  %s\n' "$REGCTL_LINUX_AMD64_SHA256" "$RUNNER_TEMP/regctl-bin/regctl" \
            | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/regctl-bin/regctl"
          echo "$RUNNER_TEMP/regctl-bin" >> "$GITHUB_PATH"

      - name: Validate every source identity before registry authentication
        shell: bash
        run: |
          set -euo pipefail
          tests/persisted-state-gate/prepare-candidate-images.sh \
            artifacts/candidates "$RUNNER_TEMP/win235-publish-oci" false
          set -a
          source artifacts/candidates/agent.env
          source artifacts/candidates/webapp.env
          source artifacts/candidates/migrations.env
          set +a
          node - <<'NODE'
          const fs = require("node:fs");
          const tested = JSON.parse(fs.readFileSync("artifacts/gate/candidate-images.json", "utf8"));
          const expected = {
            commitSha: process.env.GITHUB_SHA,
            agent: process.env.WIN235_AGENT_IMAGE,
            webapp: process.env.WIN235_WEBAPP_IMAGE,
            migrations: process.env.WIN235_MIGRATIONS_IMAGE,
          };
          if (JSON.stringify(tested) !== JSON.stringify(expected)) {
            throw new Error("publication sources do not match the passing persisted-state identities");
          }
          NODE

      - name: Log in to GHCR only on the trusted publication path
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified staging manifests and immutable commit tags
        shell: bash
        run: |
          set -euo pipefail
          candidate_tag="candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          for candidate in \
            "agent WIN235_AGENT_IMAGE" \
            "webapp WIN235_WEBAPP_IMAGE" \
            "migrations WIN235_MIGRATIONS_IMAGE"; do
            read -r name identity_variable <<<"$candidate"
            identity="${!identity_variable}"
            repository="${identity%@*}"
            expected_digest="${identity##*@}"
            staging_ref="${repository}:${candidate_tag}"
            regctl image import "$staging_ref" "artifacts/candidates/${name}.oci.tar"
            test "$(regctl image digest "$staging_ref")" = "$expected_digest"
            test "$(
              regctl image inspect --platform linux/amd64 "$staging_ref" \
                --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}'
            )" = "$GITHUB_SHA"
          done

          # Validate the full staging set and every pre-existing immutable SHA
          # tag before creating any new release tag. SHA tags are never moved.
          for identity_variable in \
            WIN235_AGENT_IMAGE WIN235_WEBAPP_IMAGE WIN235_MIGRATIONS_IMAGE; do
            identity="${!identity_variable}"
            repository="${identity%@*}"
            expected_digest="${identity##*@}"
            test "$(regctl image digest "${repository}:${candidate_tag}")" = "$expected_digest"
            commit_ref="${repository}:sha-${GITHUB_SHA}"
            if existing_digest="$(regctl image digest "$commit_ref" 2>/dev/null)"; then
              test "$existing_digest" = "$expected_digest"
            fi
          done

          for identity_variable in \
            WIN235_AGENT_IMAGE WIN235_WEBAPP_IMAGE WIN235_MIGRATIONS_IMAGE; do
            identity="${!identity_variable}"
            repository="${identity%@*}"
            expected_digest="${identity##*@}"
            commit_ref="${repository}:sha-${GITHUB_SHA}"
            if ! regctl image digest "$commit_ref" >/dev/null 2>&1; then
              regctl image copy "$identity" "$commit_ref"
            fi
          done

          # Verify the complete commit-tag set before reporting publication.
          # There is intentionally no mutable `latest` tag, so a failure cannot
          # partially advance the default release pointer across repositories.
          for identity_variable in \
            WIN235_AGENT_IMAGE WIN235_WEBAPP_IMAGE WIN235_MIGRATIONS_IMAGE; do
            identity="${!identity_variable}"
            repository="${identity%@*}"
            expected_digest="${identity##*@}"
            test "$(regctl image digest "${repository}:sha-${GITHUB_SHA}")" = "$expected_digest"
          done

          mkdir -p artifacts/published
          node - <<'NODE'
          const fs = require("node:fs");
          const published = {
            commitSha: process.env.GITHUB_SHA,
            agent: process.env.WIN235_AGENT_IMAGE,
            webapp: process.env.WIN235_WEBAPP_IMAGE,
            migrations: process.env.WIN235_MIGRATIONS_IMAGE,
            mutableLatestPublished: false,
          };
          fs.writeFileSync(
            "artifacts/published/published-images.json",
            `${JSON.stringify(published, null, 2)}\n`
          );
          NODE

      - name: Upload verified publication record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: win235-published-images-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/published/published-images.json
          if-no-files-found: error
          retention-days: 14
